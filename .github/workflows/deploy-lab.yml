name: Deploy Lab (semi-auto)

# Despliegue al Learner Lab solo con clic manual.
# Requiere Environment "clases" con Secrets AWS (+ Session Token).
#
# Backend key (sin workspace en el path):
#   key = "01-cloud-infrastructure/terraform.tfstate"
# Con workspace clases → s3://…/env:/clases/01-cloud-infrastructure/terraform.tfstate

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Accion a ejecutar"
        required: true
        type: choice
        options:
          - plan
          - apply
          - full-deploy
          - images-only
          - destroy
        default: plan
      confirm:
        description: "DEPLOY para apply/full-deploy/images-only; DESTROY para destroy"
        required: true
        type: string
        default: ""
      skip_images:
        description: "Omitir build/push (solo si ECR ya tiene las 5 imagenes)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lab-clases
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_FILE: environments/clases/terraform.tfvars
  WORKING_DIR: 01-cloud-infrastructure
  TF_VAR_aws_profile: ""
  TF_STATE_KEY: 01-cloud-infrastructure/terraform.tfstate

jobs:
  guard:
    name: Validar confirmacion
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar confirmacion segun accion
        env:
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            plan)
              echo "plan no requiere confirmacion especial"
              ;;
            apply|full-deploy|images-only)
              if [ "$CONFIRM" != "DEPLOY" ]; then
                echo "::error::Para $ACTION debes escribir exactamente: DEPLOY"
                exit 1
              fi
              ;;
            destroy)
              if [ "$CONFIRM" != "DESTROY" ]; then
                echo "::error::Para destroy debes escribir exactamente: DESTROY"
                exit 1
              fi
              ;;
            *)
              echo "::error::Accion desconocida: $ACTION"
              exit 1
              ;;
          esac

  terraform:
    name: Terraform ${{ inputs.action }}
    needs: guard
    if: inputs.action != 'images-only'
    runs-on: ubuntu-latest
    environment: clases
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    outputs:
      alb_url: ${{ steps.outs.outputs.alb_url }}
      mysql_ip: ${{ steps.outs.outputs.mysql_ip }}
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Verificar variables de backend y tfvars
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
          HAS_AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
          HAS_AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' }}
          HAS_AWS_TOKEN: ${{ secrets.AWS_SESSION_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ -z "${TF_STATE_BUCKET:-}" ] || [ -z "${TF_LOCK_TABLE:-}" ]; then
            echo "::error::Configura Variables TF_STATE_BUCKET y TF_LOCK_TABLE (tras bootstrap 00-terraform-state)"
            exit 1
          fi
          if [ ! -f "${TF_VAR_FILE}" ]; then
            echo "::error::Falta ${TF_VAR_FILE} en el repo"
            exit 1
          fi
          if [ "$HAS_AWS_KEY" != "true" ] || [ "$HAS_AWS_SECRET" != "true" ] || [ "$HAS_AWS_TOKEN" != "true" ]; then
            echo "::error::Faltan Secrets AWS_* en Environment clases"
            exit 1
          fi
          echo "bucket=$TF_STATE_BUCKET table=$TF_LOCK_TABLE key=$TF_STATE_KEY"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verificar identidad (token vigente)
        run: |
          set -euo pipefail
          if ! aws sts get-caller-identity; then
            echo "::error::Session Token expirado. Renueva Secrets desde AWS Details del lab."
            exit 1
          fi

      - name: Migrar state si existe key duplicado clases/clases
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          OLD_KEY="env:/clases/clases/01-cloud-infrastructure/terraform.tfstate"
          NEW_KEY="env:/clases/${TF_STATE_KEY}"
          if aws s3api head-object --bucket "$TF_STATE_BUCKET" --key "$OLD_KEY" >/dev/null 2>&1; then
            if aws s3api head-object --bucket "$TF_STATE_BUCKET" --key "$NEW_KEY" >/dev/null 2>&1; then
              echo "Ruta nueva ya existe; no se copia."
            else
              echo "Migrando $OLD_KEY -> $NEW_KEY"
              aws s3 cp "s3://${TF_STATE_BUCKET}/${OLD_KEY}" "s3://${TF_STATE_BUCKET}/${NEW_KEY}"
            fi
          else
            echo "Sin state en ruta vieja (OK)."
          fi

      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Generar backend.hcl
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "bucket         = \"${TF_STATE_BUCKET}\"" \
            "key            = \"${TF_STATE_KEY}\"" \
            "region         = \"${AWS_REGION}\"" \
            "dynamodb_table = \"${TF_LOCK_TABLE}\"" \
            "encrypt        = true" \
            > backend.hcl
          cat backend.hcl

      - name: terraform init
        run: terraform init -reconfigure -backend-config=backend.hcl -input=false

      - name: Seleccionar workspace clases
        run: |
          set -euo pipefail
          if terraform workspace list | grep -qE '(^|\*)[[:space:]]*clases$'; then
            terraform workspace select clases
          else
            terraform workspace new clases
          fi
          terraform workspace show

      - name: terraform plan
        if: inputs.action == 'plan' || inputs.action == 'apply' || inputs.action == 'full-deploy'
        run: terraform plan -var-file="${TF_VAR_FILE}" -input=false -out=tfplan

      - name: terraform apply
        if: inputs.action == 'apply' || inputs.action == 'full-deploy'
        run: terraform apply -input=false -auto-approve tfplan

      - name: terraform destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -var-file="${TF_VAR_FILE}" -input=false -auto-approve

      - name: Publicar outputs
        if: inputs.action == 'apply' || inputs.action == 'full-deploy' || inputs.action == 'plan'
        id: outs
        run: |
          set -euo pipefail
          safe_out() {
            local key="$1" name="$2" val=""
            val="$(terraform output -raw "$name" 2>/dev/null | tr -d '\r' | head -n 1 || true)"
            if [ -z "$val" ] || [[ "$val" == *"Warning"* ]] || [[ "$val" == *"│"* ]] || [[ "$val" == *"Error"* ]]; then
              val="n/a"
            fi
            echo "${key}=${val}" >> "$GITHUB_OUTPUT"
          }
          safe_out alb_url alb_url
          safe_out mysql_ip mysql_private_ip

      - name: Job summary
        if: always()
        env:
          ALB: ${{ steps.outs.outputs.alb_url || 'n/a' }}
          MYSQL: ${{ steps.outs.outputs.mysql_ip || 'n/a' }}
        run: |
          {
            echo "## Deploy Lab — ${{ inputs.action }}"
            echo ""
            echo "| Item | Valor |"
            echo "|------|-------|"
            echo "| Accion | \`${{ inputs.action }}\` |"
            echo "| ALB (usar **http**, no https) | ${ALB} |"
            echo "| MySQL private IP | \`${MYSQL}\` |"
            if [ "$ALB" != "n/a" ] && [ -n "$ALB" ]; then
              echo ""
              echo "Abrir: [${ALB}](${ALB})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  containers:
    name: Build/Push + Deploy App
    needs: [guard, terraform]
    if: always() && needs.guard.result == 'success' && (inputs.action == 'full-deploy' || inputs.action == 'images-only') && (inputs.action == 'images-only' || needs.terraform.result == 'success')
    runs-on: ubuntu-latest
    environment: clases
    env:
      DO_BUILD: ${{ inputs.skip_images != true && inputs.skip_images != 'true' }}
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Decidir build de imagenes
        run: |
          echo "skip_images='${{ inputs.skip_images }}' DO_BUILD='${DO_BUILD}'"
          if [ "${DO_BUILD}" != "true" ]; then
            echo "::warning::Build omitido (skip_images=true). ECR debe tener imagenes previas."
          fi

      - name: Set up QEMU (ARM64)
        if: env.DO_BUILD == 'true'
        uses: docker/setup-qemu-action@v3.6.0

      - name: Set up Docker Buildx
        if: env.DO_BUILD == 'true'
        uses: docker/setup-buildx-action@v3.10.0

      - name: Login ECR
        if: env.DO_BUILD == 'true'
        id: ecr
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Build and push imagenes ARM64
        if: env.DO_BUILD == 'true'
        env:
          ACCOUNT_ID: ${{ steps.ecr.outputs.account }}
        run: |
          set -euo pipefail
          ECR="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          build_push() {
            local repo="$1" path="$2"
            aws ecr describe-repositories --repository-names "$repo" >/dev/null 2>&1 \
              || aws ecr create-repository --repository-name "$repo" >/dev/null
            echo "=== Building ${repo} ==="
            docker buildx build --platform linux/arm64 -t "${ECR}/${repo}:latest" "$path" --push
          }
          build_push freshbox-frontend microservicioFrontend
          build_push freshbox-get-products microserviciosBackend/get-products
          build_push freshbox-create-product microserviciosBackend/create-product
          build_push freshbox-update-product microserviciosBackend/update-product
          build_push freshbox-delete-product microserviciosBackend/delete-product
          for r in freshbox-frontend freshbox-get-products freshbox-create-product freshbox-update-product freshbox-delete-product; do
            n="$(aws ecr describe-images --repository-name "$r" --query 'length(imageDetails)' --output text)"
            echo "$r: $n"
            [ "$n" -ge 1 ]
          done

      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Migrar state si hace falta + init
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
          TF_VAR_aws_profile: ""
        working-directory: 01-cloud-infrastructure
        run: |
          set -euo pipefail
          OLD_KEY="env:/clases/clases/01-cloud-infrastructure/terraform.tfstate"
          NEW_KEY="env:/clases/${TF_STATE_KEY}"
          if aws s3api head-object --bucket "$TF_STATE_BUCKET" --key "$OLD_KEY" >/dev/null 2>&1; then
            if ! aws s3api head-object --bucket "$TF_STATE_BUCKET" --key "$NEW_KEY" >/dev/null 2>&1; then
              aws s3 cp "s3://${TF_STATE_BUCKET}/${OLD_KEY}" "s3://${TF_STATE_BUCKET}/${NEW_KEY}"
            fi
          fi
          printf '%s\n' \
            "bucket         = \"${TF_STATE_BUCKET}\"" \
            "key            = \"${TF_STATE_KEY}\"" \
            "region         = \"${AWS_REGION}\"" \
            "dynamodb_table = \"${TF_LOCK_TABLE}\"" \
            "encrypt        = true" \
            > backend.hcl
          terraform init -reconfigure -backend-config=backend.hcl -input=false
          terraform workspace select clases

      - name: Reciclar ASG (deploy contenedores)
        working-directory: 01-cloud-infrastructure
        run: |
          set -euo pipefail
          export AWS_DEFAULT_REGION="$AWS_REGION"
          ../03-deployment-scripts/deploy-docker-services.sh

      - name: Smoke test ALB
        working-directory: 01-cloud-infrastructure
        run: |
          set -euo pipefail
          ALB=$(terraform output -raw alb_url)
          echo "Usar HTTP (no HTTPS): $ALB"
          echo "## Smoke test" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: [$ALB]($ALB)" >> "$GITHUB_STEP_SUMMARY"

          root_ok=0
          api_ok=0
          for i in $(seq 1 24); do
            ROOT=$(curl -sS -o /tmp/alb-root.html -w "%{http_code}" --max-time 15 "$ALB/" || echo 000)
            API=$(curl -sS -o /tmp/alb-api.json -w "%{http_code}" --max-time 15 "$ALB/api/products" || echo 000)
            echo "attempt $i -> /=$ROOT /api/products=$API"
            [ "$ROOT" = "200" ] && root_ok=1
            if [ "$API" = "200" ]; then
              api_ok=1
              head -c 400 /tmp/alb-api.json; echo
              break
            fi
            sleep 15
          done

          {
            echo ""
            echo "| Check | Resultado |"
            echo "|-------|-----------|"
            echo "| GET / | $([ "$root_ok" = 1 ] && echo OK || echo FAIL) |"
            echo "| GET /api/products | $([ "$api_ok" = 1 ] && echo OK || echo FAIL) |"
            echo ""
            echo "> Si el navegador no carga, confirma que la URL empieza por **http://** (el ALB no tiene HTTPS)."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$root_ok" != 1 ]; then
            echo "::error::Frontend / no responde 200"
            exit 1
          fi
          if [ "$api_ok" != 1 ]; then
            echo "::error::API /api/products no responde 200 (revisa MySQL / nginx / contenedores)"
            exit 1
          fi
