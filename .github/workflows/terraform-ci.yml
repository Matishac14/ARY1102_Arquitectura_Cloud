name: Terraform CI

# Validacion estatica (sin credenciales AWS).
# Corre en PR/push cuando cambia Terraform. No crea ni destruye recursos.
# Para desplegar al lab usa el workflow "Deploy Lab (semi-auto)".

on:
  pull_request:
    paths:
      - "00-terraform-state/**"
      - "01-cloud-infrastructure/**"
      - ".github/workflows/terraform-ci.yml"
  push:
    branches: [main, master]
    paths:
      - "00-terraform-state/**"
      - "01-cloud-infrastructure/**"
      - ".github/workflows/terraform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

jobs:
  validate-bootstrap:
    name: "00 — Validar bootstrap tfstate (fmt + validate)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 00-terraform-state
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Cache Terraform providers
        uses: actions/cache@v4.2.3
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-plugins-${{ runner.os }}-00-${{ hashFiles('00-terraform-state/.terraform.lock.hcl') }}
          restore-keys: |
            tf-plugins-${{ runner.os }}-00-
            tf-plugins-${{ runner.os }}-

      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  validate-infra:
    name: "01 — Validar infra cloud (fmt + validate)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01-cloud-infrastructure
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Cache Terraform providers
        uses: actions/cache@v4.2.3
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-plugins-${{ runner.os }}-01-${{ hashFiles('01-cloud-infrastructure/.terraform.lock.hcl') }}
          restore-keys: |
            tf-plugins-${{ runner.os }}-01-
            tf-plugins-${{ runner.os }}-

      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init -backend=false

      - name: terraform validate
        run: terraform validate
