server {
    listen 80;
    server_name localhost;

    # Necesario cuando proxy_pass usa variables (DNS de ClusterIP)
    resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # CRUD por metodo HTTP → microservicios ClusterIP (FQDN del namespace)
    location /api/products {
        set $backend "get-products.freshbox.svc.cluster.local:3001";
        if ($request_method = POST) { set $backend "create-product.freshbox.svc.cluster.local:3002"; }
        if ($request_method = PUT) { set $backend "update-product.freshbox.svc.cluster.local:3003"; }
        if ($request_method = DELETE) { set $backend "delete-product.freshbox.svc.cluster.local:3004"; }

        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type $content_type;
    }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
# FreshBox EP2 · routing CRUD via frontend nginx
