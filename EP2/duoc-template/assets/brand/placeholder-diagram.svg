<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <rect width="1200" height="600" rx="16" fill="#F8F9FA" stroke="#D1D5DB" stroke-width="2"/>
  <text x="600" y="45" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#002B49" text-anchor="middle">DIAGRAMA DE ARQUITECTURA / FLUJO DE PROCESOS (PLANTILLA)</text>
  
  <!-- Bloque 1: Canales -->
  <g transform="translate(60, 95)">
    <rect width="220" height="430" rx="12" fill="#FFFFFF" stroke="#002B49" stroke-width="2"/>
    <rect width="220" height="44" rx="12" fill="#002B49"/>
    <rect y="32" width="220" height="12" fill="#002B49"/>
    <text x="110" y="28" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Canales de Entrada</text>
    <rect x="20" y="70" width="180" height="65" rx="8" fill="#E6E7E8" stroke="#D1D5DB"/>
    <text x="110" y="108" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#262626" text-anchor="middle">Portal Web / LMS</text>
    <rect x="20" y="155" width="180" height="65" rx="8" fill="#E6E7E8" stroke="#D1D5DB"/>
    <text x="110" y="193" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#262626" text-anchor="middle">App Móvil Estudiante</text>
    <rect x="20" y="240" width="180" height="65" rx="8" fill="#E6E7E8" stroke="#D1D5DB"/>
    <text x="110" y="278" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#262626" text-anchor="middle">Sistemas de Gestión</text>
    <rect x="20" y="325" width="180" height="75" rx="8" fill="#FFF3D6" stroke="#FFB71B" stroke-width="1.5"/>
    <text x="110" y="360" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#002B49" text-anchor="middle">Mesa de Servicio</text>
    <text x="110" y="382" font-family="Arial, sans-serif" font-size="11" fill="#7F8083" text-anchor="middle">Atención Transversal</text>
  </g>

  <!-- Flecha 1 -->
  <path d="M 290 310 L 360 310" stroke="#FFB71B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- Bloque 2: Capa Central -->
  <g transform="translate(370, 95)">
    <rect width="460" height="430" rx="12" fill="#FFFFFF" stroke="#FFB71B" stroke-width="2.5"/>
    <rect width="460" height="44" rx="12" fill="#FFB71B"/>
    <rect y="32" width="460" height="12" fill="#FFB71B"/>
    <text x="230" y="28" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#262626" text-anchor="middle">Capa Central de Servicios y Microservicios</text>
    
    <rect x="30" y="70" width="185" height="145" rx="10" fill="#E6E7E8"/>
    <text x="122" y="105" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#002B49" text-anchor="middle">Motor de Auditoría</text>
    <text x="122" y="135" font-family="Arial, sans-serif" font-size="12" fill="#262626" text-anchor="middle">Reglas de Calidad</text>
    <text x="122" y="160" font-family="Arial, sans-serif" font-size="12" fill="#262626" text-anchor="middle">Validación Académica</text>
    <text x="122" y="190" font-family="Arial, sans-serif" font-size="12" fill="#196B24" font-weight="bold" text-anchor="middle">✓ Cobertura 100%</text>

    <rect x="245" y="70" width="185" height="145" rx="10" fill="#E6E7E8"/>
    <text x="337" y="105" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#002B49" text-anchor="middle">Automatizaciones</text>
    <text x="337" y="135" font-family="Arial, sans-serif" font-size="12" fill="#262626" text-anchor="middle">Disparadores Webhooks</text>
    <text x="337" y="160" font-family="Arial, sans-serif" font-size="12" fill="#262626" text-anchor="middle">Alertas Preventivas</text>
    <text x="337" y="190" font-family="Arial, sans-serif" font-size="12" fill="#196B24" font-weight="bold" text-anchor="middle">✓ Tiempo Real</text>

    <rect x="30" y="235" width="400" height="165" rx="10" fill="#F0F1F3" stroke="#D1D5DB"/>
    <text x="230" y="270" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#002B49" text-anchor="middle">API Gateway & Orquestación Segura</text>
    <text x="230" y="300" font-family="Arial, sans-serif" font-size="13" fill="#262626" text-anchor="middle">Autenticación Single Sign-On (SSO) Institucional</text>
    <text x="230" y="328" font-family="Arial, sans-serif" font-size="13" fill="#262626" text-anchor="middle">Cifrado TLS 1.3 · Balanceo Elástico · Reglas WAF</text>
    <rect x="110" y="350" width="240" height="32" rx="16" fill="#FFB71B"/>
    <text x="230" y="371" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#002B49" text-anchor="middle">Alta Disponibilidad 99.5%</text>
  </g>

  <!-- Flecha 2 -->
  <path d="M 840 310 L 910 310" stroke="#FFB71B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- Bloque 3: Datos e Infraestructura -->
  <g transform="translate(920, 95)">
    <rect width="220" height="430" rx="12" fill="#FFFFFF" stroke="#002B49" stroke-width="2"/>
    <rect width="220" height="44" rx="12" fill="#002B49"/>
    <rect y="32" width="220" height="12" fill="#002B49"/>
    <text x="110" y="28" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Datos y Almacén</text>
    <rect x="20" y="70" width="180" height="95" rx="8" fill="#E6E7E8" stroke="#D1D5DB"/>
    <text x="110" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#262626" text-anchor="middle">Base de Datos</text>
    <text x="110" y="130" font-family="Arial, sans-serif" font-size="12" fill="#7F8083" text-anchor="middle">Multi-AZ / Relacional</text>
    <text x="110" y="150" font-family="Arial, sans-serif" font-size="12" fill="#196B24" font-weight="bold" text-anchor="middle">Réplicas de lectura</text>
    <rect x="20" y="185" width="180" height="95" rx="8" fill="#E6E7E8" stroke="#D1D5DB"/>
    <text x="110" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#262626" text-anchor="middle">Almacenamiento</text>
    <text x="110" y="245" font-family="Arial, sans-serif" font-size="12" fill="#7F8083" text-anchor="middle">Objetos y Archivos</text>
    <text x="110" y="265" font-family="Arial, sans-serif" font-size="12" fill="#196B24" font-weight="bold" text-anchor="middle">Cifrado AES-256</text>
    <rect x="20" y="300" width="180" height="95" rx="8" fill="#E6E7E8" stroke="#D1D5DB"/>
    <text x="110" y="335" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#262626" text-anchor="middle">Data Warehouse</text>
    <text x="110" y="360" font-family="Arial, sans-serif" font-size="12" fill="#7F8083" text-anchor="middle">Métricas Institucionales</text>
    <text x="110" y="380" font-family="Arial, sans-serif" font-size="12" fill="#196B24" font-weight="bold" text-anchor="middle">Analítica en vivo</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#FFB71B"/>
    </marker>
  </defs>
</svg>
