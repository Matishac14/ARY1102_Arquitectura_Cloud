server {
    listen 80;
    server_name localhost;

    # DNS embebido de Docker — obligatorio si proxy_pass usa variables
    resolver 127.0.0.11 ipv6=off valid=10s;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /api/products {
        set $backend "";
        if ($request_method = GET)  { set $backend "get-products:3001"; }
        if ($request_method = POST) { set $backend "create-product:3002"; }
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ~ ^/api/products/(\d+)$ {
        set $backend "";
        if ($request_method = PUT)    { set $backend "update-product:3003"; }
        if ($request_method = DELETE) { set $backend "delete-product:3004"; }
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}

