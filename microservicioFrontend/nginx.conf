server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # if + proxy_pass directo es fragil; set $upstream es el patron estable
    location /api/products {
        set $upstream "";
        if ($request_method = GET)  { set $upstream "get-products:3001"; }
        if ($request_method = POST) { set $upstream "create-product:3002"; }
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/api/products/(\d+)$ {
        set $upstream "";
        if ($request_method = PUT)    { set $upstream "update-product:3003"; }
        if ($request_method = DELETE) { set $upstream "delete-product:3004"; }
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

